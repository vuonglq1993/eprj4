spring:
  application:
    name: Language Learning Backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/language_learning?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASS:}

    hikari:
      pool-name: LanguageLearningPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

#  data:
#    redis:
#      host: ${REDIS_HOST}
#      port: ${REDIS_PORT}
#      password: ${REDIS_PASSWORD}
#      timeout: 5000ms

  cache:
    type: simple

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
frontend:
    url: ${FRONTEND_URL}
backend:
    url: ${BACKEND_URL}
Android:
    url: ${ANDROID_URL}

jwt:
 secret: ${JWT_SECRET}
 access-token-expiration: 900000
 refresh-token-expiration: 2592000000

google:
  client-id: ${GOOGLE_CLIENT_ID}